<a class="skip-link" href="#main">{{ 'app.skipToContent' | t }}</a>
<header class="masthead">
  <div
    class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 py-4"
  >
    <a class="masthead__name" routerLink="/">{{ 'app.name' | t }}</a>
    <p class="masthead__tagline">{{ 'app.tagline' | t }}</p>
  </div>
</header>
<main id="main" class="mx-auto pb-24" tabindex="-1">
  <router-outlet />
</main>
<lc-snackbar-host />
