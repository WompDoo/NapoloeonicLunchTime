<section class="join lc-panel" aria-labelledby="join-title">
  <form class="grid gap-4 p-5" (ngSubmit)="submit()">
    <h1 id="join-title" class="join__title">{{ 'join.title' | t }}</h1>
    <p class="join__intro">{{ 'join.intro' | t }}</p>
    <div class="grid gap-2">
      <label class="lc-label" for="player-name">{{ 'join.name' | t }}</label>
      <input
        id="player-name"
        name="name"
        class="lc-input"
        autocomplete="nickname"
        maxlength="40"
        required
        [(ngModel)]="name"
        [attr.aria-invalid]="joinError() ? true : null"
        [attr.aria-describedby]="joinError() ? 'join-error' : null"
      />
      @if (joinError(); as error) {
        <p id="join-error" class="lc-field-error">
          {{ errorKeyOf(error) | t }}
        </p>
      }
    </div>
    <div>
      <button
        type="submit"
        class="lc-button"
        [disabled]="name().trim() === '' || join.status() === 'pending'"
      >
        {{ 'join.submit' | t }}
      </button>
    </div>
  </form>
</section>
